[package]
name = "triple"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
description = "Tuple-style LAN pair programming, built in Rust. No accounts, no cloud, no configuration."
license = "MIT"
readme = "README.md"
repository = "https://github.com/ashayas/triple"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.9", features = ["tls-rustls-ring"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
local-ip-address = "0.6"
rand = "0.8"
rcgen = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-tungstenite = "0.28"

[profile.release]
lto = "thin"
strip = true
